<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ImmoInvest</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #111; }
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f7f7f8;
      --color-text-primary: #111111;
      --color-text-secondary: #6b7280;
      --color-text-tertiary: #9ca3af;
      --color-border-secondary: #d1d5db;
      --color-border-tertiary: #e5e7eb;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --font-mono: 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    input, select, textarea, button { font-family: inherit; }
    #root { height: 100vh; display: flex; flex-direction: column; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
// Polyfill window.storage via localStorage
window.storage = {
  get: (key) => Promise.resolve(localStorage.getItem(key) ? { value: localStorage.getItem(key) } : null),
  set: (key, val) => { localStorage.setItem(key, val); return Promise.resolve(true); },
  delete: (key) => { localStorage.removeItem(key); return Promise.resolve(true); },
};
</script>
<script type="text/babel">
const { useState, useCallback, useEffect, useRef, useMemo } = React;

const FRONT_VERSION = 'v41.2';   // doit correspondre à VERSION dans Code.gs (contrôle affiché dans la barre latérale)
const APPS_SCRIPT_URL = 'https://immoinvest-proxy.mederic-de-vaux.workers.dev';
const STORAGE_BIENS = 'immo_invest_biens_v3';
const STORAGE_CONTACTS = 'immo_invest_contacts_v3';
const STORAGE_LISTINGS = 'immo_invest_listings_v3';
const FRAIS_NOTAIRE_DEFAULT = 0.08;
const FRAIS_AGENCE_DEFAULT = 0.05;

// ─── Utilitaires de base ─────────────────────────────────────────────────────
// Un 0 saisi est une valeur valable (ex. 0 % de frais d'agence) : on ne remplace que le vide.
const numOr = (v, d) => { if (v === '' || v === null || v === undefined) return d; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const isTrue = (v) => v === true || String(v).toLowerCase() === 'true';
const todayStr = () => new Date().toISOString().slice(0, 10);
const jp = (v, d) => { if (v===undefined||v===null||v==='') return d; if (typeof v==='object') return v; try { return JSON.parse(v); } catch { return d; } };
const fmtN = (v, suf='') => (v===null||v===undefined||v==='') ? '—' : Number(v).toLocaleString('fr-FR',{maximumFractionDigits:1}) + suf;
function cleanTitle(t) { return (t||'').replace(/\+/g,' '); }
function formatDate(d) {
  if (!d) return '—';
  const s = String(d).slice(0, 10);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.split('-').reverse().join('/');
  return s;
}
function joursDepuis(date) {
  if (!date) return null;
  const d = new Date(String(date).slice(0,10));
  if (isNaN(d.getTime())) return null;
  const j = Math.floor((Date.now()-d.getTime())/86400000);
  return j >= 0 ? j : null;
}

// Frais effectifs : frais d'agence = 0 % pour un particulier, sauf saisie manuelle (miroir du serveur)
const fnEff = (b) => numOr(b.fraisNotaire, FRAIS_NOTAIRE_DEFAULT);
const faEff = (b) => {
  const s = numOr(b.fraisAgence, null);
  if (isTrue(b.fraisAgence_manuel) && s !== null) return s;
  if (String(b.ownerType || '') === 'Particulier') return 0;
  return s !== null ? s : FRAIS_AGENCE_DEFAULT;
};
// Le rendement est TOUJOURS recalculé depuis loyers / prix / frais (jamais lu tel quel)
const rendementOf = (b) => {
  const p = numOr(b.price, 0), l = numOr(b.loyers, 0);
  if (!(p > 0 && l > 0)) return null;
  return Number(((l / (p * (1 + fnEff(b)) + p * faEff(b))) * 100).toFixed(1));
};
function calcRendement(prix, loyers, fn, fa) {
  if (!prix || !loyers) return null;
  return ((loyers / (prix * (1 + fn) + prix * fa)) * 100).toFixed(1);
}
function calcMensualite(m, t, d) {
  const r = t / 12 / 100, n = d * 12;
  if (!(n > 0) || !(m > 0)) return 0;
  if (r === 0) return m / n;
  return (m * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
}

// ─── Synchronisation vers la Sheet (v41.1 : les échecs sont visibles, jamais silencieux) ───
const syncState = { failures: [] };
const syncListeners = new Set();
function emitSync() { const snap = { failures: syncState.failures.slice() }; syncListeners.forEach(f => f(snap)); }
function useSyncState() {
  const [s, setS] = useState({ failures: syncState.failures.slice() });
  useEffect(() => { syncListeners.add(setS); return () => { syncListeners.delete(setS); }; }, []);
  return s;
}
// Appel GET au serveur ; lève une erreur (e.server = true si le serveur a répondu success:false)
async function apiGet(params) {
  const res = await fetch(`${APPS_SCRIPT_URL}?${new URLSearchParams(params).toString()}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  let d;
  try { d = await res.json(); } catch (e) { throw new Error('Réponse illisible du serveur'); }
  if (d.success === false || d.error) { const e = new Error(d.error || 'Erreur serveur'); e.server = true; throw e; }
  return d;
}
function pushFailure(f) {
  if (f.kind === 'fields') {
    const ex = syncState.failures.find(x => x.kind === 'fields' && String(x.id) === String(f.id));
    if (ex) { ex.fields = { ...ex.fields, ...f.fields }; ex.msg = f.msg; emitSync(); return; }
  }
  syncState.failures.push(f); emitSync();
}
// Envoie un ou plusieurs champs d'un bien (valeurs typées côté serveur). Renvoie true/false.
async function syncFieldsToSheet(id, fields, opts = {}) {
  try {
    await apiGet({ action: 'updateBien', id: String(id), fields: JSON.stringify(fields) });
    return true;
  } catch (e) {
    if (opts.queue !== false) pushFailure({ kind: 'fields', id: String(id), fields, msg: e.message });
    return false;
  }
}
const syncFieldToSheet = (id, field, value) => syncFieldsToSheet(id, { [field]: value });
// Ajoute une interaction dans la Sheet Interactions. Renvoie true/false.
async function pushInteractionToSheet(interaction, bienId, bienTitle, opts = {}) {
  try {
    await apiGet({
      action: 'addInteraction', id: String(interaction.id), bienId: String(bienId || ''), bienTitle: bienTitle || '',
      type: interaction.type || '', date: interaction.date || '', auteur: interaction.auteur || '', note: interaction.note || '',
    });
    return true;
  } catch (e) {
    if (opts.queue !== false) pushFailure({ kind: 'interaction', interaction, bienId: String(bienId || ''), bienTitle: bienTitle || '', msg: e.message });
    return false;
  }
}
async function retrySync() {
  const todo = syncState.failures.slice();
  syncState.failures = [];
  emitSync();
  for (const f of todo) {
    const ok = f.kind === 'fields'
      ? await syncFieldsToSheet(f.id, f.fields, { queue: false })
      : await pushInteractionToSheet(f.interaction, f.bienId, f.bienTitle, { queue: false });
    if (!ok) syncState.failures.push(f);
  }
  emitSync();
}
function ignorerSync() { syncState.failures = []; emitSync(); }

function SyncBanner() {
  const { failures } = useSyncState();
  const [busy, setBusy] = useState(false);
  if (!failures.length) return null;
  return (
    <div style={{display:'flex',alignItems:'center',gap:10,background:'#FCEBEB',borderBottom:'0.5px solid #F7C1C1',color:'#791F1F',fontSize:12,padding:'7px 14px',flexShrink:0}}>
      <span style={{flex:1}}>⚠ {failures.length} modification{failures.length>1?'s':''} non enregistrée{failures.length>1?'s':''} dans la Sheet ({failures[0].msg}). Elles sont conservées dans ce navigateur.</span>
      <button disabled={busy} onClick={async()=>{setBusy(true);await retrySync();setBusy(false);}} style={{fontSize:11,padding:'3px 10px',borderRadius:5,border:'0.5px solid #F7C1C1',background:'#fff',color:'#791F1F',cursor:'pointer'}}>{busy?'…':'Réessayer'}</button>
      <button onClick={ignorerSync} style={{fontSize:11,padding:'3px 10px',borderRadius:5,border:'0.5px solid #F7C1C1',background:'transparent',color:'#791F1F',cursor:'pointer'}}>Ignorer</button>
    </div>
  );
}

// ─── Analyse d'investissement ────────────────────────────────────────────────
// Champs que le serveur écrit lors d'une analyse (relus tels quels depuis la Sheet)
const IA_FIELDS = ['ia_analysed','score_ia','raison_ia','loyer_source','type_bien_ia','nb_lots','dpe','ges','annee_construction','loyer_actuel','loyer_potentiel','travaux_type','travaux_resume','lots_json','rendement_actuel','rendement_cible','rendement_net_actuel','rendement_net_cible','prix_max_8pct_actuel','prix_max_8pct_cible','marche_json','hypotheses_json','synthese_ia','points_forts_ia','risques_ia','questions_ia','negociation_ia','dossier_ia','dossier_date','analyse_version','ia_erreur','ia_tentatives'];
// Champs effacés localement avant d'appliquer une nouvelle analyse (le serveur fait de même dans la Sheet)
const ANALYSE_LOCAL = ['score_ia','raison_ia','loyer_source','loyer_actuel','loyer_potentiel','dpe','ges','nb_lots','annee_construction','travaux_type','travaux_resume','type_bien_ia','lots_json','rendement_actuel','rendement_cible','rendement_net_actuel','rendement_net_cible','prix_max_8pct_actuel','prix_max_8pct_cible','marche_json','hypotheses_json','synthese_ia','points_forts_ia','risques_ia','questions_ia','negociation_ia','ia_erreur','ia_tentatives'];
function pickIA(b, ex) {
  const o = {};
  IA_FIELDS.forEach(k => { o[k] = b[k] !== undefined ? b[k] : ex[k]; });
  // v41.2 : un bien écarté par le serveur (analyse automatique) s'affiche « Écarté » ici aussi,
  // sauf si tu as déjà posé toi-même un autre statut que « Nouveau »
  if (b.statut === 'Écarté' && (!ex.statut || ex.statut === 'Nouveau')) { o.statut = 'Écarté'; o.statutDate = b.statutDate || ex.statutDate; }
  return o;
}
// Transforme le résultat de analyzeAnnonce en champs de bien (mêmes formats que la Sheet)
function patchFromResult(r) {
  const p = {};
  ['score_ia','raison_ia','loyer_source','rendement_actuel','rendement_cible','rendement_net_actuel','rendement_net_cible','prix_max_8pct_actuel','prix_max_8pct_cible','synthese_ia','analyse_version','loyer_actuel','loyer_potentiel','dpe','ges','nb_lots','annee_construction','travaux_type','travaux_resume','type_bien_ia'].forEach(k => { if (r[k]!==undefined && r[k]!==null && r[k]!=='') p[k] = r[k]; });
  if (r.lots)            p.lots_json = JSON.stringify(r.lots);
  if (r.points_forts_ia) p.points_forts_ia = JSON.stringify(r.points_forts_ia);
  if (r.risques_ia)      p.risques_ia = JSON.stringify(r.risques_ia);
  if (r.questions_ia)    p.questions_ia = JSON.stringify(r.questions_ia);
  if (r.negociation_ia)  p.negociation_ia = JSON.stringify(r.negociation_ia);
  if (r.marche_json)     p.marche_json = JSON.stringify(r.marche_json);
  if (r.hypotheses_json) p.hypotheses_json = JSON.stringify(r.hypotheses_json);
  return p;
}
// Bien après analyse : l'ancienne analyse est effacée avant d'appliquer la nouvelle ; un loyer saisi à la main est conservé
function bienAfterAnalysis(cur, r) {
  const b = { ...cur };
  ANALYSE_LOCAL.forEach(k => { b[k] = ''; });
  Object.assign(b, patchFromResult(r));
  if (r.loyer_actuel && !isTrue(cur.loyers_manuel)) b.loyers = Math.round(Number(r.loyer_actuel));
  b.ia_analysed = todayStr();
  return b;
}
const PROPOSITION_STATUT = { 'À étudier': 'En étude', 'À écarter': 'Écarté' };
const SCORE_ORDER = { 'À étudier': 3, 'À qualifier': 2, 'À écarter': 1 };
const rendColor = (x) => x===null||x===undefined||x===''?'var(--color-text-tertiary)':Number(x)>=8?'#27500A':Number(x)>=6?'#633806':'#791F1F';
const ecartPctOf = (b) => { const m = jp(b.marche_json, null); const v = m ? numOr(m.ecart_pct, null) : null; return v; };
// Type de bien : d'abord la qualification IA, sinon mots du titre ; '' = inconnu (reste visible)
const typeBienOf = (b) => {
  const t = String(b.type_bien_ia || '');
  if (t === 'Immeuble de rapport') return '9_5';
  if (t === 'Local commercial') return '9_7';
  if (t === 'Appartement') return '9_1';
  if (t === 'Maison') return '9_2';
  const s = cleanTitle(b.title).toLowerCase();
  if (/(immeuble|rapport|copropri|\blots?\b)/.test(s)) return '9_5';
  if (/(local|commerce|boutique|bureau)/.test(s)) return '9_7';
  if (/\b(maison|villa|pavillon)\b/.test(s)) return '9_2';
  if (/^\s*(appartement|studio|duplex|loft)/.test(s)) return '9_1';
  return '';
};
const aAnalyser = (b) => !!b.desc && !b.ia_analysed && !b.score_ia && !isTrue(b.expired) && b.statut !== 'Écarté' && numOr(b.ia_tentatives, 0) < 2;

function AnalyseInvest({ bien, onDeep, deepLoading, deepError }) {
  const lots = jp(bien.lots_json, []);
  const marche = jp(bien.marche_json, null);
  const fortsIA = jp(bien.points_forts_ia, []);
  const risques = jp(bien.risques_ia, []);
  const questions = jp(bien.questions_ia, []);
  const nego = jp(bien.negociation_ia, null);
  const hyp = jp(bien.hypotheses_json, null);
  const [copied, setCopied] = useState(false);
  const has = bien.rendement_actuel || bien.rendement_cible || lots.length || bien.synthese_ia;
  if (!has) return null;
  const box = {border:'0.5px solid var(--color-border-tertiary)',borderRadius:'var(--border-radius-md)',padding:'10px 12px'};
  const h = {fontSize:11,fontWeight:500,color:'var(--color-text-secondary)',marginBottom:8,textTransform:'uppercase'};
  const tiles = [
    ['Rendement actuel', bien.rendement_actuel, 'loyers en place'],
    ['Rendement cible', bien.rendement_cible, 'lots libres relocés'+(hyp&&hyp.travaux_eur?' + travaux':'')],
    ['Net actuel', bien.rendement_net_actuel, hyp&&hyp.charges_estimees?'charges estimées':'après taxe foncière/charges'],
    ['Net cible', bien.rendement_net_cible, hyp&&hyp.charges_estimees?'charges estimées':'après taxe foncière/charges'],
  ];
  const price = numOr(bien.price, 0);
  const dec = (pm) => (pm && price>0) ? Math.round((1 - pm/price)*100) : null;
  return (
    <div style={{marginBottom:12,...box,background:'var(--color-background-primary)'}}>
      <div style={{...h,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>📊 Analyse d'investissement</span>
        <span style={{fontSize:10,fontWeight:400,textTransform:'none'}}>{bien.analyse_version||''}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:10}}>
        {tiles.map(([label,val,sub])=>(<div key={label} style={{background:'var(--color-background-secondary)',borderRadius:6,padding:'8px 10px'}}>
          <div style={{fontSize:10,color:'var(--color-text-secondary)'}}>{label}</div>
          <div style={{fontSize:20,fontWeight:500,color:rendColor(val)}}>{val!==undefined&&val!==null&&val!==''?fmtN(val,' %'):'—'}</div>
          <div style={{fontSize:10,color:'var(--color-text-tertiary)'}}>{sub}</div>
        </div>))}
      </div>
      {(bien.prix_max_8pct_actuel||bien.prix_max_8pct_cible)&&<div style={{fontSize:12,marginBottom:10,padding:'6px 8px',background:'var(--color-background-secondary)',borderRadius:6}}>
        <span style={{fontWeight:500}}>🎯 Prix pour 8 % brut : </span>
        {bien.prix_max_8pct_actuel&&<span>sur loyers actuels <b>{fmtN(bien.prix_max_8pct_actuel,' €')}</b>{dec(bien.prix_max_8pct_actuel)!==null&&<span style={{color:'var(--color-text-secondary)'}}> ({dec(bien.prix_max_8pct_actuel)>0?'−':'+'}{Math.abs(dec(bien.prix_max_8pct_actuel))} % vs prix demandé)</span>}</span>}
        {bien.prix_max_8pct_actuel&&bien.prix_max_8pct_cible&&<span> · </span>}
        {bien.prix_max_8pct_cible&&<span>sur loyers cibles <b>{fmtN(bien.prix_max_8pct_cible,' €')}</b>{dec(bien.prix_max_8pct_cible)!==null&&<span style={{color:'var(--color-text-secondary)'}}> ({dec(bien.prix_max_8pct_cible)>0?'−':'+'}{Math.abs(dec(bien.prix_max_8pct_cible))} %)</span>}</span>}
        {nego&&nego.signaux&&nego.signaux.length>0&&<div style={{marginTop:4,color:'#633806'}}>Signaux de négociation : {nego.signaux.join(' · ')}</div>}
      </div>}
      {lots.length>0&&<div style={{marginBottom:10}}>
        <div style={h}>Lots</div>
        <div style={{fontSize:12}}>
          {lots.map((l,i)=>(<div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1fr .8fr 1.2fr',gap:6,padding:'4px 0',borderBottom:'0.5px solid var(--color-border-tertiary)'}}>
            <span>{l.designation}<span style={{color:'var(--color-text-tertiary)'}}> · {l.usage}</span></span>
            <span style={{color:'var(--color-text-secondary)'}}>{l.surface?l.surface+' m²':'—'}</span>
            <span style={{color:l.statut==='libre'?'#633806':'#27500A'}}>{l.statut==='libre'?'Libre':l.statut==='loue'?'Loué':'?'}</span>
            <span style={{textAlign:'right'}}>{l.statut==='libre'?(l.estime_an?<i>~{fmtN(l.estime_an,' €/an')}</i>:'—'):l.loyer_an?fmtN(l.loyer_an,' €/an')+(l.tva_incluse?' HT':''):'—'}</span>
          </div>))}
        </div>
      </div>}
      {marche&&(marche.ref_m2||(marche.risques_communaux&&marche.risques_communaux.length>0))&&<div style={{marginBottom:10,fontSize:12}}>
        <div style={h}>Marché (données publiques)</div>
        {marche.ref_m2&&<div>Prix demandé <b>{fmtN(marche.ppm2,' €/m²')}</b> · médiane des ventes ({marche.ref_type}, {marche.ref_n} ventes) <b>{fmtN(marche.ref_m2,' €/m²')}</b>{marche.ecart_pct!==null&&marche.ecart_pct!==undefined&&<span style={{fontWeight:500,color:marche.ecart_pct<=0?'#27500A':'#791F1F'}}> → {marche.ecart_pct>0?'+':''}{fmtN(marche.ecart_pct,' %')}</span>}</div>}
        {marche.risques_communaux&&marche.risques_communaux.length>0&&<div style={{color:'var(--color-text-secondary)',marginTop:2}}>Risques recensés sur la commune : {marche.risques_communaux.join(', ')}</div>}
      </div>}
      {bien.synthese_ia&&<div style={{fontSize:12,marginBottom:10,padding:'8px 10px',background:'#EAF3DE',border:'0.5px solid #C0DD97',borderRadius:6,color:'#27500A'}}><b>Synthèse : </b>{bien.synthese_ia}</div>}
      {(fortsIA.length>0||risques.length>0)&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10,fontSize:12}}>
        <div><div style={h}>Points forts</div>{fortsIA.length?fortsIA.map((x,i)=><div key={i} style={{padding:'2px 0'}}>✅ {x}</div>):<span style={{color:'var(--color-text-tertiary)'}}>—</span>}</div>
        <div><div style={h}>Risques / alertes</div>{risques.length?risques.map((x,i)=><div key={i} style={{padding:'2px 0'}}>⚠️ {x}</div>):<span style={{color:'var(--color-text-tertiary)'}}>—</span>}</div>
      </div>}
      {questions.length>0&&<div style={{marginBottom:10,fontSize:12}}>
        <div style={{...h,display:'flex',justifyContent:'space-between'}}><span>Questions à poser à l'agent</span>
          <button onClick={()=>{try{navigator.clipboard.writeText(questions.map(q=>'- '+q).join('\n'));setCopied(true);setTimeout(()=>setCopied(false),1500);}catch(e){}}} style={{fontSize:10,padding:'2px 8px',borderRadius:5,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-primary)',cursor:'pointer',textTransform:'none'}}>{copied?'Copié ✓':'Copier'}</button></div>
        {questions.map((q,i)=><div key={i} style={{padding:'2px 0'}}>• {q}</div>)}
      </div>}
      <div style={{borderTop:'0.5px solid var(--color-border-tertiary)',paddingTop:10}}>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6}}>
          <button onClick={onDeep} disabled={deepLoading} style={{fontSize:11,padding:'4px 10px',borderRadius:6,border:'0.5px solid #B5D4F4',background:'#E6F1FB',color:'#0C447C',cursor:deepLoading?'wait':'pointer'}}>{deepLoading?'⏳ Recherche web en cours (jusqu\'à 1 min)…':'🔎 Analyse approfondie (recherche web)'}</button>
          {bien.dossier_date&&<span style={{fontSize:10,color:'var(--color-text-tertiary)'}}>dossier du {formatDate(bien.dossier_date)}</span>}
        </div>
        {deepError&&<div style={{fontSize:12,color:'#791F1F',background:'#FCEBEB',border:'0.5px solid #F7C1C1',borderRadius:6,padding:'6px 8px'}}>⚠ {deepError}</div>}
        {bien.dossier_ia&&<div style={{fontSize:12,whiteSpace:'pre-wrap',lineHeight:1.5}}>{bien.dossier_ia}</div>}
      </div>
    </div>
  );
}

const TYPES_BIEN = [
  { id: "9", label: "Tous" }, { id: "9_5", label: "Immeuble" },
  { id: "9_7", label: "Local commercial" }, { id: "9_1", label: "Appartement" }, { id: "9_2", label: "Maison" },
];
const STATUTS = ["Nouveau", "En étude", "Contacté", "Visité", "Suivi", "À appeler", "Écarté"];
const STATUT_COLORS = {
  "Nouveau":    { bg: "#E6F1FB", text: "#0C447C", border: "#B5D4F4" },
  "En étude":   { bg: "#EEEDFE", text: "#3C3489", border: "#AFA9EC" },
  "Contacté":   { bg: "#FAEEDA", text: "#633806", border: "#FAC775" },
  "Visité":     { bg: "#EAF3DE", text: "#27500A", border: "#C0DD97" },
  "Suivi":      { bg: "#E1F5EE", text: "#085041", border: "#5DCAA5" },
  "À appeler":  { bg: "#FFF7ED", text: "#9A3412", border: "#FDBA74" },
  "Écarté":     { bg: "#FCEBEB", text: "#791F1F", border: "#F7C1C1" },
};
const TYPES_CONTACT = ["Agent immobilier","Agence","Notaire","Chasseur immobilier","Particulier","Marchand de biens","Syndic","Gestionnaire","Promoteur","Autre"];
const INT_TYPES = ["Appel","Email","RDV","Visite","SMS","Note"];

function Badge({ statut }) {
  const c = STATUT_COLORS[statut] || STATUT_COLORS["Nouveau"];
  return <span style={{ background: c.bg, color: c.text, border: `0.5px solid ${c.border}`, borderRadius: 5, padding: "2px 7px", fontSize: 11, fontWeight: 500 }}>{statut}</span>;
}
function Avatar({ nom }) {
  const i = nom?.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
  return <div style={{ width: 32, height: 32, borderRadius: '50%', background: '#E6F1FB', color: '#0C447C', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 500, flexShrink: 0 }}>{i}</div>;
}
function useStorage(key) {
  const [data, setDataState] = useState({});
  const loaded = useRef(false);
  useEffect(() => {
    if (loaded.current) return; loaded.current = true;
    window.storage?.get(key).then(r => { if (r?.value) try { setDataState(JSON.parse(r.value)); } catch {} }).catch(()=>{});
  }, [key]);
  const setData = useCallback((u) => {
    setDataState(prev => { const next = typeof u==='function'?u(prev):u; window.storage?.set(key,JSON.stringify(next)).catch(()=>{}); return next; });
  }, [key]);
  return [data, setData];
}

// Champ numérique avec brouillon : on peut taper « 3. » ou « 0,5 » sans que la valeur soit réécrite sous les doigts
function NumField({ value, onCommit, step, width = 70, min = 0, max }) {
  const [draft, setDraft] = useState(value === null || value === undefined ? '' : String(value));
  useEffect(() => { if (Number(draft.replace(',', '.')) !== Number(value)) setDraft(value === null || value === undefined ? '' : String(value)); }, [value]);
  return <input type="number" value={draft} step={step} min={min} max={max}
    onChange={e => { setDraft(e.target.value); const n = parseFloat(String(e.target.value).replace(',', '.')); if (!isNaN(n)) onCommit(n); else if (e.target.value === '') onCommit(0); }}
    style={{ width, fontSize:12, padding:'2px 5px', borderRadius:5, border:'0.5px solid var(--color-border-secondary)', background:'var(--color-background-primary)', color:'var(--color-text-primary)', textAlign:'right' }} />;
}

function PctField({ label, value, onChange, prix, hint }) {
  const euros = Math.round(prix * value);
  return (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 0', fontSize:12, borderBottom:'0.5px solid var(--color-border-tertiary)' }}>
      <span style={{ color:'var(--color-text-secondary)', flex:1 }}>{label}{hint}</span>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        <div style={{ display:'flex', alignItems:'center', border:'0.5px solid var(--color-border-secondary)', borderRadius:6, overflow:'hidden' }}>
          <NumField value={Number((value*100).toFixed(2))} onCommit={p => onChange(p/100)} step="0.1" min={0} max={20} width={52} />
          <span style={{ fontSize:11, padding:'0 5px', color:'var(--color-text-tertiary)', background:'var(--color-background-secondary)' }}>%</span>
        </div>
        <span style={{ fontSize:11, color:'var(--color-text-secondary)', minWidth:80, textAlign:'right', fontWeight:500 }}>{euros.toLocaleString('fr-FR')} €</span>
      </div>
    </div>
  );
}

function LoyerField({ value, onChange, manuel }) {
  const [draft, setDraft] = useState(value||0);
  useEffect(() => { setDraft(value||0); }, [value]);
  return (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 0', fontSize:12, borderBottom:'0.5px solid var(--color-border-tertiary)' }}>
      <span style={{ color:'var(--color-text-secondary)' }}>Loyers annuels (€){manuel&&<span title="Saisi à la main : les ré-analyses IA ne l'écrasent pas" style={{marginLeft:6,fontSize:10,color:'#0C447C',background:'#E6F1FB',borderRadius:4,padding:'1px 5px'}}>saisi à la main</span>}</span>
      <div style={{ display:'flex', alignItems:'center', gap:4 }}>
        <input type="number" value={draft} step="1000" min="0" onChange={e => setDraft(parseFloat(e.target.value)||0)} onBlur={() => { if (draft !== (value||0)) onChange(draft); }} onKeyDown={e => e.key==='Enter' && onChange(draft)} style={{ width:100, fontSize:12, padding:'2px 5px', borderRadius:5, border:'0.5px solid var(--color-border-secondary)', background:'var(--color-background-primary)', color:'var(--color-text-primary)', textAlign:'right' }} />
        <span style={{ fontSize:11, color:'var(--color-text-tertiary)' }}>€/an</span>
      </div>
    </div>
  );
}

// Ligne « libellé / valeur » (hors composant pour ne pas perdre le focus à chaque frappe)
function FRow({ label, val, onEdit, step }) {
  return (<div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:12,borderBottom:'0.5px solid var(--color-border-tertiary)'}}><span style={{color:'var(--color-text-secondary)'}}>{label}</span>{onEdit?<NumField value={val} onCommit={onEdit} step={step} width={90}/>:<span style={{fontWeight:500}}>{val}</span>}</div>);
}

function ContactInfoBlock({ bien, contacts, onLink, onAdd }) {
  const info = bien.contactInfo || {};
  const displayName = bien.ownerName || info.nom || '';
  const displayPhone = bien.ownerPhone || info.telephone || '';
  const displayEmail = info.email || '';
  const hasInfo = displayName || displayPhone || displayEmail;
  const match = Object.values(contacts).find(c =>
    (displayPhone && c.telephone?.replace(/\D/g,'') === String(displayPhone).replace(/\D/g,'')) ||
    (displayEmail && c.email === displayEmail) ||
    (displayName && c.nom?.toLowerCase() === displayName.toLowerCase())
  );
  if (!hasInfo) return <div style={{ fontSize:11, color:'var(--color-text-tertiary)', fontStyle:'italic', marginTop:8 }}>Aucune information de contact détectée.</div>;
  return (
    <div style={{ marginTop:10, display:'flex', flexDirection:'column', gap:6 }}>
      <div style={{ fontSize:11, fontWeight:500, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.04em' }}>Contact détecté</div>
      <div style={{ background:'var(--color-background-secondary)', borderRadius:6, padding:'7px 10px', fontSize:12 }}>
        {displayName && <div style={{ fontWeight:500 }}>{displayName} {bien.ownerType ? <span style={{ fontWeight:400, color:'var(--color-text-secondary)' }}>· {bien.ownerType}</span> : ''}</div>}
        {displayPhone && <div style={{ color:'var(--color-text-secondary)', marginTop:2 }}>📞 {displayPhone}</div>}
        {displayEmail && <div style={{ color:'var(--color-text-secondary)', marginTop:2 }}>✉ {displayEmail}</div>}
      </div>
      {match ? (
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:11, color:'#27500A', background:'#EAF3DE', borderRadius:6, padding:'6px 10px' }}>
          <span>✓ Dans la base : <strong>{match.nom}</strong></span>
          <button onClick={() => onLink(match.id)} style={{ fontSize:11, padding:'2px 8px', borderRadius:5, border:'0.5px solid #C0DD97', background:'#fff', color:'#27500A', cursor:'pointer' }}>Lier</button>
        </div>
      ) : (
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:11, color:'#633806', background:'#FAEEDA', borderRadius:6, padding:'6px 10px' }}>
          <span>⚠ Contact non trouvé</span>
          <button onClick={() => onAdd({ nom:displayName, telephone:displayPhone, email:displayEmail })} style={{ fontSize:11, padding:'2px 8px', borderRadius:5, border:'0.5px solid #FAC775', background:'#fff', color:'#633806', cursor:'pointer' }}>+ Créer</button>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// ─── RECHERCHE / LISTE ──────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════
const FILTRES_VIDES = { cp:'', prixMin:'', prixMax:'', surfaceMin:'', type:'9', rendMin:'', contactId:'', statut:'', score:'', rendCibleMin:'', ecartMax:'', inclureSansDonnee:true };
const SORT_OPTIONS = [['rendement','Rendement'],['rend_cible','Rendement cible'],['score','Score IA'],['ecart','Écart au marché'],['date','Date de publication'],['price','Prix'],['surface','Surface'],['loyers','Loyers'],['ppm2','€/m²'],['cp','Code postal'],['statut','Statut'],['contact','Contact'],['title','Titre']];
const SORT_TEXT = ['cp','statut','contact','title'];

function SearchView({ onOpenBien, biens, updateBien, setBiens, contacts }) {
  const [filters, setFilters] = useState(FILTRES_VIDES);
  const [vue, setVue] = useState('live');                 // 'live' | 'ecartes'
  const [listings, setListingsState] = useState(() => {
    try { const s = localStorage.getItem(STORAGE_LISTINGS); return s ? JSON.parse(s) : []; } catch { return []; }
  });
  const setListings = (val) => {
    const next = typeof val === 'function' ? val(listings) : val;
    setListingsState(next);
    try { localStorage.setItem(STORAGE_LISTINGS, JSON.stringify(next)); } catch {}
  };
  const [loadingSheet, setLoadingSheet] = useState(false);
  const [analysingIA, setAnalysingIA]   = useState(false);
  const [iaProgress, setIaProgress]     = useState({ done: 0, total: 0, errors: 0 });
  const [error, setError] = useState('');
  const [notif, setNotif] = useState('');
  const [lastRun, setLastRun] = useState(null);
  const [openDropdownId, setOpenDropdownId] = useState(null);
  const [sortCol, setSortCol] = useState('rendement');
  const [sortDir, setSortDir] = useState('desc');
  const stopRef = useRef(false);
  const biensRef = useRef(biens); biensRef.current = biens;

  const setF = (k, v) => setFilters(f => ({ ...f, [k]: v }));
  const toggleSort = (col) => { if (sortCol===col) setSortDir(d=>d==='asc'?'desc':'asc'); else { setSortCol(col); setSortDir(SORT_TEXT.includes(col)?'asc':'desc'); } };

  const chargerDepuisSheet = useCallback(async () => {
    setLoadingSheet(true); setNotif(''); setError('');
    try {
      const data = await apiGet({ action: 'getBiens', v: String(Date.now()) });
      if (data.biens?.length) {
        const dirty = new Set(syncState.failures.filter(f => f.kind === 'fields').map(f => String(f.id)));
        setBiens(prev => {
          const next = {...prev};
          data.biens.forEach(b => {
            const bid = String(b.id);
            if (!bid) return;
            const ex = next[bid];
            const price = numOr(b.price, 0);
            const surface = numOr(b.surface, 0);
            const loyers = numOr(b.loyers, 0);
            const ppm2 = surface > 0 ? Math.round(price / surface) : null;
            if (ex) {
              const keepLocal = dirty.has(bid);   // modifications locales pas encore enregistrées : on ne les écrase pas
              next[bid] = {
                ...ex,
                price, surface,
                title: b.title || ex.title,
                url: b.url || ex.url,
                desc: b.desc || ex.desc || '',
                ownerName: b.ownerName || ex.ownerName || '',
                ownerPhone: b.ownerPhone || ex.ownerPhone || '',
                ownerType: b.ownerType || ex.ownerType || '',
                cp: b.cp !== undefined && b.cp !== '' ? String(b.cp) : ex.cp,
                ville: b.ville || ex.ville,
                ppm2: ppm2 ?? ex.ppm2,
                date: b.date || ex.date,
                lastSeen: b.lastSeen || ex.lastSeen,
                expired: b.expired !== undefined && b.expired !== '' ? isTrue(b.expired) : ex.expired,
                ...(keepLocal ? {} : {
                  loyers,
                  loyers_manuel: isTrue(b.loyers_manuel),
                  fraisAgence: numOr(b.fraisAgence, ex.fraisAgence),
                  fraisAgence_manuel: isTrue(b.fraisAgence_manuel),
                }),
                ...pickIA(b, ex),
              };
            } else {
              next[bid] = {
                ...b, id: bid, price, surface, loyers, ppm2,
                cp: String(b.cp ?? ''),
                loyers_manuel: isTrue(b.loyers_manuel), fraisAgence_manuel: isTrue(b.fraisAgence_manuel),
                fraisNotaire: numOr(b.fraisNotaire, FRAIS_NOTAIRE_DEFAULT),
                fraisAgence: numOr(b.fraisAgence, FRAIS_AGENCE_DEFAULT),
                statut: b.statut || 'Nouveau',
                interactions: b.interactions ? (typeof b.interactions === 'string' ? jp(b.interactions, []) : b.interactions) : [],
                notes: b.notes ?? '',
                expired: isTrue(b.expired),
              };
            }
          });
          return next;
        });
        setListings(data.biens.map(b => ({ id: String(b.id) })));
        setNotif(`✅ ${data.biens.length} biens chargés depuis le Sheet`);
        setLastRun(new Date());
      } else if (data.biens?.length === 0) {
        setNotif('⚠️ Sheet vide — lance d\'abord le bookmarklet');
      } else { setNotif('⚠️ Réponse inattendue'); }
    } catch(e) { setError(`❌ Erreur : ${e.message}`); }
    setLoadingSheet(false);
  }, [setBiens]);

  // ── Liste de travail : biens fusionnés → valeurs normalisées ──
  const merged = useMemo(() => listings.map(l => {
    const m = { ...l, ...biens[l.id] };
    m.price = numOr(m.price, 0); m.surface = numOr(m.surface, 0); m.loyers = numOr(m.loyers, 0);
    m.expired = isTrue(m.expired);
    m.cp = String(m.cp ?? '');
    m.rendement = rendementOf(m);
    m.ppm2 = m.surface > 0 && m.price > 0 ? Math.round(m.price / m.surface) : null;
    return m;
  }), [listings, biens]);

  // Vue de liste : biens « live » ou « écartés et expirés »
  const estEcarte = (l) => l.expired || l.statut === 'Écarté';
  const viewList = useMemo(() => merged.filter(l => vue === 'live' ? !estEcarte(l) : estEcarte(l)), [merged, vue]);

  // Liste déroulante des codes postaux : construite sur les biens de la vue courante
  const cpOptions = useMemo(() => {
    const g = {};
    viewList.forEach(l => {
      const k = l.cp || '';
      if (!g[k]) g[k] = { n: 0, villes: {} };
      g[k].n++;
      const v = String(l.ville || '').trim();
      if (v) g[k].villes[v] = (g[k].villes[v] || 0) + 1;
    });
    const opts = Object.keys(g).filter(k => k !== '').sort().map(k => {
      const villes = Object.entries(g[k].villes).sort((a, b) => b[1] - a[1]);
      return { value: k, label: `${k}${villes.length ? ' – ' + villes[0][0] : ''} (${g[k].n})` };
    });
    if (g['']) opts.push({ value: '__none__', label: `Sans code postal (${g[''].n})` });
    if (filters.cp && !opts.some(o => o.value === filters.cp)) opts.push({ value: filters.cp, label: `${filters.cp === '__none__' ? 'Sans code postal' : filters.cp} (0)` });
    return opts;
  }, [viewList, filters.cp]);

  const contactName = (l) => (l.contactId && contacts[l.contactId]) ? contacts[l.contactId].nom : '';
  const filtered = useMemo(() => {
    const f = filters, incl = f.inclureSansDonnee;
    const passMin = (val, min) => (min === '' || min === null) ? true : (val === null ? incl : val >= Number(min));
    return viewList.filter(l => {
      if (f.cp === '__none__') { if (l.cp) return false; }
      else if (f.cp && !l.cp.startsWith(f.cp)) return false;
      if (f.contactId && l.contactId !== f.contactId) return false;
      if (f.statut && l.statut !== f.statut) return false;
      if (f.prixMin !== '' && l.price < Number(f.prixMin)) return false;
      if (f.prixMax !== '' && l.price > Number(f.prixMax)) return false;
      if (!passMin(l.surface > 0 ? l.surface : null, f.surfaceMin)) return false;
      if (f.type && f.type !== '9') { const t = typeBienOf(l); if (t && t !== f.type) return false; }   // type inconnu : reste visible
      if (!passMin(l.rendement, f.rendMin)) return false;
      if (!passMin(numOr(l.rendement_cible, null), f.rendCibleMin)) return false;
      if (f.ecartMax !== '') { const e = ecartPctOf(l); if (e === null ? !incl : e > Number(f.ecartMax)) return false; }
      if (f.score) { if (f.score === '__none__' ? !!l.score_ia : l.score_ia !== f.score) return false; }
      return true;
    });
  }, [viewList, filters]);

  const sortKey = (l) => {
    switch (sortCol) {
      case 'rendement': return l.rendement;
      case 'rend_cible': return numOr(l.rendement_cible, null);
      case 'score': return SCORE_ORDER[l.score_ia] ?? null;
      case 'ecart': return ecartPctOf(l);
      case 'date': return l.date || null;
      case 'price': return l.price || null;
      case 'surface': return l.surface || null;
      case 'loyers': return l.loyers || null;
      case 'ppm2': return l.ppm2;
      case 'cp': return l.cp || null;
      case 'statut': { const i = STATUTS.indexOf(l.statut); return i === -1 ? null : i; }   // ordre du pipeline
      case 'contact': return contactName(l).toLowerCase() || null;
      case 'title': return cleanTitle(l.title).toLowerCase() || null;
      default: return l.rendement;
    }
  };
  const shown = useMemo(() => {
    const keyed = filtered.map(l => ({ l, k: sortKey(l) }));
    const isNull = (v) => v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v));
    keyed.sort((A, B) => {
      const tie = (B.l.date || '').localeCompare(A.l.date || '') || cleanTitle(A.l.title).localeCompare(cleanTitle(B.l.title), 'fr');
      const na = isNull(A.k), nb = isNull(B.k);
      if (na && nb) return tie;
      if (na) return 1;          // les valeurs absentes sont toujours en bas, quel que soit le sens
      if (nb) return -1;
      const r = typeof A.k === 'string' ? A.k.localeCompare(B.k, 'fr', { numeric: true }) : A.k - B.k;
      if (r === 0) return tie;
      return sortDir === 'asc' ? r : -r;
    });
    return keyed.map(x => x.l);
  }, [filtered, sortCol, sortDir, contacts]);

  const nbAAnalyser = shown.filter(aAnalyser).length;

  // ── Analyse IA par lot : sur la liste affichée, arrêtable, sans relance automatique des échecs ──
  const runBatchIA = async () => {
    const todo = shown.filter(aAnalyser).map(l => l.id);
    if (!todo.length || analysingIA) return;
    stopRef.current = false; setAnalysingIA(true); setNotif('');
    let errors = 0;
    setIaProgress({ done: 0, total: todo.length, errors: 0 });
    for (let i = 0; i < todo.length; i++) {
      if (stopRef.current) break;
      const id = todo[i];
      try {
        const data = await apiGet({ action: 'analyzeAnnonce', id });
        const cur = biensRef.current[id];
        if (data.result && cur) updateBien(bienAfterAnalysis(cur, data.result));
      } catch(e) {
        errors++;
        const cur = biensRef.current[id];
        if (e.server && cur) updateBien({ ...cur, ia_erreur: String(e.message).slice(0, 200), ia_tentatives: numOr(cur.ia_tentatives, 0) + 1 });
      }
      setIaProgress({ done: i + 1, total: todo.length, errors });
    }
    setAnalysingIA(false);
    setNotif(errors ? `⚠️ Analyse terminée avec ${errors} échec(s) — ouvre ces biens pour voir l'erreur ; ils ne sont pas relancés automatiquement.` : (stopRef.current ? '⏹ Analyse arrêtée.' : '✅ Analyse terminée.'));
  };

  const appliquerProposition = (l) => {
    const target = PROPOSITION_STATUT[l.score_ia];
    if (!target || l.statut === target) return;
    const d = todayStr();
    updateBien({ ...biens[l.id], ...l, statut: target, statutDate: d });
    syncFieldsToSheet(l.id, { statut: target, statutDate: d });
  };

  const exportCsv = () => {
    const rows = [['Titre','CP','Prix','Surface','Loyers/an','Rendement','Rendement cible','Score IA','Travaux','Statut','Contact','Notes','URL']];
    shown.forEach(l => { rows.push([cleanTitle(l.title),l.cp,l.price,l.surface,l.loyers,l.rendement?l.rendement+'%':'',l.rendement_cible?l.rendement_cible+'%':'',l.score_ia||'',l.travaux||'',l.statut,contactName(l),l.notes||'',l.url]); });
    const csv = rows.map(r=>r.map(v=>`"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+csv); a.download='immo_invest.csv'; a.click();
  };

  const inp = { fontSize:12, padding:'4px 7px', borderRadius:6, border:'0.5px solid var(--color-border-secondary)', background:'var(--color-background-primary)', color:'var(--color-text-primary)', width:'100%' };
  const rends = shown.map(l => l.rendement).filter(r => r !== null);
  const bucket = (test) => shown.filter(l => l.rendement !== null && test(l.rendement)).length;
  const nbVue = { live: merged.filter(l => !estEcarte(l)).length, ecartes: merged.filter(estEcarte).length };

  return (
    <div style={{padding:'14px 16px'}}>
      <div style={{background:'var(--color-background-secondary)',borderRadius:'var(--border-radius-md)',padding:'12px 14px',marginBottom:12}}>
        <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr',gap:8,marginBottom:8}}>
          {[['Code postal',<select key="cp" value={filters.cp} onChange={e=>setF('cp',e.target.value)} style={inp}><option value="">Tous ({viewList.length})</option>{cpOptions.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>],
            ['Prix min (€)',<input key="pmin" type="number" value={filters.prixMin} onChange={e=>setF('prixMin',e.target.value)} placeholder="0" style={inp}/>],
            ['Prix max (€)',<input key="pmax" type="number" value={filters.prixMax} onChange={e=>setF('prixMax',e.target.value)} style={inp}/>],
            ['Surface min',<input key="surf" type="number" value={filters.surfaceMin} onChange={e=>setF('surfaceMin',e.target.value)} style={inp}/>],
            ['Rendement min',<input key="rend" type="number" value={filters.rendMin} onChange={e=>setF('rendMin',e.target.value)} placeholder="8" style={inp}/>],
            ['Statut',<select key="statut" value={filters.statut} onChange={e=>setF('statut',e.target.value)} style={inp}><option value="">Tous</option>{STATUTS.map(s=><option key={s}>{s}</option>)}</select>],
            ['Type',<select key="type" value={filters.type} onChange={e=>setF('type',e.target.value)} style={inp}>{TYPES_BIEN.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>],
            ['Contact',<select key="contact" value={filters.contactId} onChange={e=>setF('contactId',e.target.value)} style={inp}><option value="">Tous</option>{Object.values(contacts).map(c=><option key={c.id} value={c.id}>{c.nom}</option>)}</select>],
          ].map(([label,input])=>(<div key={label}><div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:3}}>{label}</div>{input}</div>))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr 1fr 1fr 2fr 1fr',gap:8,marginBottom:8,alignItems:'end'}}>
          <div><div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:3}}>Vue</div>
            <select value={vue} onChange={e=>setVue(e.target.value)} style={inp}><option value="live">Biens live ({nbVue.live})</option><option value="ecartes">Écartés et expirés ({nbVue.ecartes})</option></select></div>
          <div><div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:3}}>Score IA</div>
            <select value={filters.score} onChange={e=>setF('score',e.target.value)} style={inp}><option value="">Tous</option><option>À étudier</option><option>À qualifier</option><option>À écarter</option><option value="__none__">Non analysé</option></select></div>
          <div><div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:3}}>Rend. cible min (%)</div>
            <input type="number" value={filters.rendCibleMin} onChange={e=>setF('rendCibleMin',e.target.value)} placeholder="9" style={inp}/></div>
          <div><div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:3}}>Écart marché max (%)</div>
            <input type="number" value={filters.ecartMax} onChange={e=>setF('ecartMax',e.target.value)} placeholder="0" style={inp}/></div>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--color-text-secondary)',cursor:'pointer',paddingBottom:5}}><input type="checkbox" checked={filters.inclureSansDonnee} onChange={e=>setF('inclureSansDonnee',e.target.checked)}/>Inclure les biens sans donnée (rendement, écart…)</label>
          <button onClick={()=>setFilters(FILTRES_VIDES)} style={{fontSize:11,padding:'5px 8px',borderRadius:6,border:'0.5px solid var(--color-border-secondary)',background:'transparent',color:'var(--color-text-secondary)',cursor:'pointer'}}>Réinitialiser</button>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <button onClick={chargerDepuisSheet} disabled={loadingSheet} style={{fontSize:12,padding:'5px 12px',borderRadius:6,border:'0.5px solid #C0DD97',background:'#EAF3DE',color:'#27500A',cursor:loadingSheet?'not-allowed':'pointer',opacity:loadingSheet?0.7:1}}>
            {loadingSheet?'⏳ Chargement…':'☁️ Charger depuis Sheet'}
          </button>
          {shown.length>0&&<button onClick={exportCsv} style={{fontSize:12,padding:'5px 12px',borderRadius:6,border:'0.5px solid var(--color-border-secondary)',background:'transparent',color:'var(--color-text-secondary)',cursor:'pointer'}}>Export CSV</button>}
          {(() => { const actif = nbAAnalyser > 0 && !analysingIA; return (<button onClick={actif?runBatchIA:undefined} disabled={!actif} style={{fontSize:12,padding:'5px 12px',borderRadius:6,border:`0.5px solid ${actif?'#C0DD97':'var(--color-border-secondary)'}`,background:analysingIA?'var(--color-background-secondary)':actif?'#EAF3DE':'var(--color-background-secondary)',color:actif?'#27500A':'var(--color-text-tertiary)',cursor:actif?'pointer':'not-allowed',opacity:actif||analysingIA?1:0.6}}>{analysingIA ? `🤖 Analyse ${iaProgress.done}/${iaProgress.total}${iaProgress.errors?` · ${iaProgress.errors} échec(s)`:''}…` : `🤖 Analyser les nouveaux (${nbAAnalyser})`}</button>); })()}
          {analysingIA&&<button onClick={()=>{stopRef.current=true;}} style={{fontSize:12,padding:'5px 12px',borderRadius:6,border:'0.5px solid #F7C1C1',background:'#FCEBEB',color:'#791F1F',cursor:'pointer'}}>⏹ Arrêter</button>}
          <span style={{fontSize:11,color:'var(--color-text-tertiary)',marginLeft:'auto'}}>Tri :</span>
          <select value={sortCol} onChange={e=>{setSortCol(e.target.value);setSortDir(SORT_TEXT.includes(e.target.value)?'asc':'desc');}} style={{...inp,width:'auto'}}>{SORT_OPTIONS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
          <button onClick={()=>setSortDir(d=>d==='asc'?'desc':'asc')} title="Inverser le sens du tri" style={{fontSize:12,padding:'4px 9px',borderRadius:6,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-primary)',cursor:'pointer'}}>{sortDir==='asc'?'↑ croissant':'↓ décroissant'}</button>
          {lastRun&&<span style={{fontSize:11,color:'var(--color-text-tertiary)'}}>Maj : {lastRun.toLocaleTimeString('fr-FR')}</span>}
        </div>
        {notif&&<div style={{marginTop:8,fontSize:12,color:(notif.startsWith('✅')||notif.startsWith('⏹'))?'#27500A':'#633806',background:(notif.startsWith('✅')||notif.startsWith('⏹'))?'#EAF3DE':'#FAEEDA',borderRadius:6,padding:'6px 10px'}}>{notif}</div>}
      </div>
      {error&&<div style={{fontSize:12,color:'#791F1F',background:'#FCEBEB',border:'0.5px solid #F7C1C1',borderRadius:8,padding:'7px 10px',marginBottom:10}}>{error}</div>}
      {merged.length>0&&(<>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:10}}>
          {[['Annonces',shown.length],['Rendement moy.',rends.length?(rends.reduce((s,r)=>s+r,0)/rends.length).toFixed(1)+'%':'—'],['Avec travaux',shown.filter(l=>l.travaux).length],[vue==='live'?'À étudier (IA)':'Dont expirés',vue==='live'?shown.filter(l=>l.score_ia==='À étudier').length:shown.filter(l=>l.expired).length]].map(([label,val])=>(<div key={label} style={{background:'var(--color-background-secondary)',borderRadius:'var(--border-radius-md)',padding:'8px 12px'}}><div style={{fontSize:11,color:'var(--color-text-secondary)',marginBottom:3}}>{label}</div><div style={{fontSize:18,fontWeight:500}}>{val}</div></div>))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginBottom:10}}>
          {[['Sans rendement',shown.filter(l=>l.rendement===null).length],['0 à 5%',bucket(r=>r<5)],['5 à 8%',bucket(r=>r>=5&&r<8)],['8 à 10%',bucket(r=>r>=8&&r<10)],['> 10%',bucket(r=>r>=10)]].map(([label,n])=>(<div key={label} style={{background:'var(--color-background-secondary)',borderRadius:'var(--border-radius-md)',padding:'6px 12px'}}><div style={{fontSize:10,color:'var(--color-text-tertiary)',marginBottom:2}}>{label}</div><div style={{fontSize:15,fontWeight:500}}>{n}</div></div>))}
        </div>
        <div style={{border:'0.5px solid var(--color-border-tertiary)',borderRadius:'var(--border-radius-md)',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr .6fr .8fr .8fr .8fr .7fr .8fr .8fr 90px',gap:4,padding:'6px 10px',fontSize:10,color:'var(--color-text-tertiary)',borderBottom:'0.5px solid var(--color-border-tertiary)',background:'var(--color-background-secondary)'}}>
            {[['title','Bien'],['cp','CP'],['price','Prix'],['surface','Surface'],['loyers','Loyers/an'],['ppm2','€/m²'],['rendement','Rendement'],['contact','Contact'],['statut','Statut']].map(([col,label])=>(
              <span key={col} onClick={()=>toggleSort(col)} style={{cursor:'pointer',userSelect:'none',display:'inline-flex',alignItems:'center',gap:2,color:sortCol===col?'var(--color-text-primary)':undefined,fontWeight:sortCol===col?500:400}}>
                {label}<span style={{opacity:sortCol===col?1:0.3,fontSize:9}}>{sortCol===col?(sortDir==='asc'?'↑':'↓'):'↕'}</span>
              </span>
            ))}
          </div>
          {openDropdownId&&<div style={{position:'fixed',inset:0,zIndex:9}} onClick={()=>setOpenDropdownId(null)}/>}
          {shown.map(l=>{
            const ecarte=l.statut==='Écarté';
            const jours=joursDepuis(l.date); const fade=ecarte?0.4:1;
            const propo = PROPOSITION_STATUT[l.score_ia];
            return(<div key={l.id} onClick={()=>onOpenBien(l,shown.map(d=>d.id))} style={{display:'grid',gridTemplateColumns:'2fr .6fr .8fr .8fr .8fr .7fr .8fr .8fr 90px',gap:4,padding:'8px 10px',fontSize:12,borderBottom:'0.5px solid var(--color-border-tertiary)',alignItems:'center',cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.background='var(--color-background-secondary)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <div style={{opacity:fade}}><div style={{fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:ecarte?'line-through':'none'}}>{cleanTitle(l.title)}</div><div style={{marginTop:2,display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>{l.date&&<span style={{fontSize:10,color:'var(--color-text-primary)',fontWeight:500}}>Publié le {formatDate(l.date)}</span>}{l.score_ia&&<span title={l.raison_ia||''} style={{fontSize:10,borderRadius:4,padding:'1px 5px',border:'0.5px solid',borderColor:l.score_ia==='À étudier'?'#C0DD97':l.score_ia==='À écarter'?'#F7C1C1':'#FAC775',background:l.score_ia==='À étudier'?'#EAF3DE':l.score_ia==='À écarter'?'#FCEBEB':'#FAEEDA',color:l.score_ia==='À étudier'?'#27500A':l.score_ia==='À écarter'?'#791F1F':'#633806'}}>🤖 {l.score_ia}{l.rendement_cible?' · cible '+l.rendement_cible+' %':''}</span>}{l.statut==='Nouveau'&&propo&&<button onClick={e=>{e.stopPropagation();appliquerProposition(l);}} title="Applique la proposition de l'IA (modifiable ensuite)" style={{fontSize:10,borderRadius:4,padding:'1px 6px',border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-primary)',color:'var(--color-text-secondary)',cursor:'pointer'}}>→ {propo}</button>}{jours!==null&&<span style={{fontSize:10,color:'var(--color-text-tertiary)'}}>il y a {jours} j</span>}{l.travaux&&<span style={{fontSize:10,color:'#633806',background:'#FAEEDA',border:'0.5px solid #FAC775',borderRadius:4,padding:'1px 5px'}}>⚠ travaux</span>}{l.expired&&<span style={{fontSize:10,color:'#791F1F',background:'#FCEBEB',border:'0.5px solid #F7C1C1',borderRadius:4,padding:'1px 5px'}}>expiré</span>}{l.ia_erreur&&!l.ia_analysed&&<span title={l.ia_erreur} style={{fontSize:10,color:'#791F1F',background:'#FCEBEB',border:'0.5px solid #F7C1C1',borderRadius:4,padding:'1px 5px'}}>analyse en échec</span>}</div></div>
              <span style={{color:'var(--color-text-secondary)',fontSize:11,opacity:fade}}>{l.cp||'—'}</span>
              <span style={{opacity:fade}}>{l.price.toLocaleString('fr-FR')} €</span>
              <span style={{opacity:fade}}>{l.surface?l.surface+' m²':'—'}</span>
              <span style={{opacity:fade}}>{l.loyers?l.loyers.toLocaleString('fr-FR')+' €':'—'}</span>
              <span style={{opacity:fade}}>{l.ppm2?l.ppm2.toLocaleString('fr-FR'):'—'}</span>
              <span style={{fontWeight:500,color:l.rendement>=8?'#27500A':l.rendement?'#633806':'var(--color-text-tertiary)',opacity:fade}}>{l.rendement?l.rendement+'%':'—'}</span>
              <span style={{fontSize:11,color:'#378ADD',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',opacity:fade}}>{contactName(l)||'—'}</span>
              <div style={{position:'relative'}} onClick={e=>{e.stopPropagation();setOpenDropdownId(openDropdownId===l.id?null:l.id);}}>
                <Badge statut={l.statut}/>
                {openDropdownId===l.id&&<div style={{position:'absolute',right:0,top:'100%',zIndex:10,background:'var(--color-background-primary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:6,boxShadow:'0 4px 12px rgba(0,0,0,0.12)',minWidth:130,marginTop:2}}>
                  {STATUTS.map(s=><div key={s} onClick={e=>{e.stopPropagation();const d=todayStr();updateBien({...biens[l.id],...l,statut:s,statutDate:d});syncFieldsToSheet(l.id,{statut:s,statutDate:d});setOpenDropdownId(null);}} style={{padding:'6px 10px',fontSize:12,cursor:'pointer',fontWeight:l.statut===s?500:400,color:l.statut===s?'var(--color-text-primary)':'var(--color-text-secondary)',background:l.statut===s?'var(--color-background-secondary)':'transparent'}} onMouseEnter={e=>e.currentTarget.style.background='var(--color-background-secondary)'} onMouseLeave={e=>e.currentTarget.style.background=l.statut===s?'var(--color-background-secondary)':'transparent'}>{s}</div>)}
                </div>}
              </div>
            </div>);
          })}
          {shown.length===0&&<div style={{textAlign:'center',padding:'2rem 0',color:'var(--color-text-tertiary)',fontSize:13}}>Aucun bien ne correspond à ces filtres.</div>}
        </div>
      </>)}
      {merged.length===0&&!error&&<div style={{textAlign:'center',padding:'3rem 0',color:'var(--color-text-tertiary)',fontSize:13}}>Clique "☁️ Charger depuis Sheet" pour voir les biens.</div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// ─── FICHE D'UN BIEN ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════
const SYNC_IMMEDIAT = ['contactId', 'expired', 'loyers', 'loyers_manuel'];
const SYNC_FRAPPE   = ['notes', 'creditApport', 'creditDuree', 'creditTaux', 'fraisNotaire', 'fraisAgence', 'fraisAgence_manuel'];

function BienDetail({ bien: init, onUpdate, contacts, setContacts, onOpenContact, navPrev, navNext, onNav }) {
  const [bien, setBien] = useState(init);
  const [ni, setNi] = useState({ type:'Appel', date:todayStr(), note:'', auteur:'' });
  const [iaLoading, setIaLoading] = useState(false);
  const [iaResult, setIaResult] = useState(null);
  const [iaError, setIaError] = useState(null);
  const [deepLoading, setDeepLoading] = useState(false);
  const [deepError, setDeepError] = useState(null);

  // Envoi vers la Sheet : champs « de frappe » regroupés (700 ms) et envoyés aussi à la sortie du champ / de la fiche
  const pendingRef = useRef({});
  const timerRef = useRef(null);
  const bienIdRef = useRef(init.id);
  const flush = () => {
    clearTimeout(timerRef.current); timerRef.current = null;
    const f = pendingRef.current; pendingRef.current = {};
    if (Object.keys(f).length) syncFieldsToSheet(bienIdRef.current, f);
  };
  const queueSync = (fields, immediate) => {
    pendingRef.current = { ...pendingRef.current, ...fields };
    clearTimeout(timerRef.current);
    if (immediate) flush(); else timerRef.current = setTimeout(flush, 700);
  };
  const flushRef = useRef(flush); flushRef.current = flush;
  useEffect(() => () => flushRef.current(), []);
  useEffect(() => {
    flushRef.current();                 // envoie ce qui reste pour le bien précédent
    bienIdRef.current = init.id;
    setBien(init); setIaResult(null); setIaError(null); setDeepError(null);
  }, [init.id]);

  const deepAnalyze = async () => {
    setDeepLoading(true); setDeepError(null);
    try {
      const data = await apiGet({ action: 'deepAnalyze', id: String(bien.id) });
      applyServer({ dossier_ia: data.dossier_ia, dossier_date: data.dossier_date });
    } catch(err) { setDeepError(err.message + ' — si c\'est un délai dépassé, réessaie une fois.'); }
    finally { setDeepLoading(false); }
  };

  // Modification venue du serveur (déjà écrite dans la Sheet) : pas de renvoi
  const applyServer = (patchOrBien, replace) => {
    const b = replace ? patchOrBien : { ...bien, ...patchOrBien };
    setBien(b); onUpdate(b);
  };

  const analyzeWithIA = async () => {
    if (!bien.desc) { setIaError('Pas de description disponible — relance le bookmarklet pour importer ce bien.'); return; }
    setIaLoading(true); setIaResult(null); setIaError(null);
    try {
      const data = await apiGet({ action: 'analyzeAnnonce', force: '1', id: String(bien.id) });
      setIaResult(data.result);
      applyServer(bienAfterAnalysis(bien, data.result), true);
    } catch(err) {
      setIaError(err.message);
      if (err.server) applyServer({ ia_erreur: String(err.message).slice(0, 200), ia_tentatives: numOr(bien.ia_tentatives, 0) + 1 });
    }
    finally { setIaLoading(false); }
  };

  // Modification saisie par l'utilisateur : enregistrée localement puis envoyée à la Sheet
  const update = (patch, opts = {}) => {
    const b = { ...bien, ...patch };
    const sync = {}; let immediate = !!opts.immediate;
    if (patch.statut !== undefined && patch.statut !== bien.statut) {
      b.statutDate = todayStr(); sync.statut = b.statut; sync.statutDate = b.statutDate; immediate = true;
    }
    SYNC_IMMEDIAT.forEach(k => { if (patch[k] !== undefined) { sync[k] = (k === 'contactId') ? (b.contactId || '') : (k === 'expired' || k === 'loyers_manuel') ? isTrue(b[k]) : numOr(b[k], 0); immediate = true; } });
    SYNC_FRAPPE.forEach(k => { if (patch[k] !== undefined) { sync[k] = (k === 'notes') ? String(b.notes ?? '') : (k === 'fraisAgence_manuel') ? isTrue(b[k]) : numOr(b[k], 0); } });
    setBien(b); onUpdate(b);
    if (Object.keys(sync).length) queueSync(sync, immediate);
  };

  const addInteraction = async () => {
    if (!ni.note) return;
    const newInt = {...ni, id: Date.now()};
    const interactions = [...(bien.interactions||[]), newInt];
    const b = {...bien, interactions};
    setBien(b); onUpdate(b);
    setNi(i=>({...i, note:''}));
    await pushInteractionToSheet(newInt, bien.id, bien.title);   // en cas d'échec : bandeau rouge + « Réessayer »
  };

  const price = numOr(bien.price, 0);
  const fn = fnEff(bien); const fa = faEff(bien);
  const rendement = rendementOf(bien);
  const prixRevient = price*(1+fn) + price*fa;
  const apport = numOr(bien.creditApport, 0), duree = numOr(bien.creditDuree, 20), taux = numOr(bien.creditTaux, 3.8);
  const montantCredit = Math.max(prixRevient - apport, 0);
  const mensualite = Math.round(calcMensualite(montantCredit, taux, duree));
  const loyers = numOr(bien.loyers, 0);
  const loyerMensuel = loyers?Math.round(loyers/12):0;
  const cashflow = loyerMensuel - mensualite;
  const contactLie = bien.contactId?contacts[bien.contactId]:null;
  const particulier = String(bien.ownerType||'') === 'Particulier';
  const faManuel = isTrue(bien.fraisAgence_manuel);
  const addContactFromInfo = (info) => { const id='c_'+Date.now(); setContacts(p=>({...p,[id]:{id,nom:info.nom||'Contact',type:'Agent immobilier',telephone:info.telephone||'',email:info.email||'',ville:'',notes:'',interactions:[],createdAt:todayStr()}})); update({contactId:id}); };
  const target = PROPOSITION_STATUT[bien.score_ia];

  return (
    <div style={{padding:'14px 16px'}}>

      {/* ── Bandeau expiré ── */}
      {isTrue(bien.expired)&&<div style={{marginBottom:12,background:'#FCEBEB',border:'0.5px solid #F7C1C1',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#791F1F',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>⚠ Cette annonce n'est plus disponible sur LeBonCoin{bien.lastSeen?` · Dernière vue : ${formatDate(bien.lastSeen)}`:''}</span>
        <button onClick={()=>update({expired:false})} style={{fontSize:11,padding:'2px 8px',borderRadius:5,border:'0.5px solid #F7C1C1',background:'#fff',color:'#791F1F',cursor:'pointer'}}>Réactiver</button>
      </div>}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
          {(navPrev||navNext)&&<div style={{display:'flex',gap:2,flexShrink:0,marginTop:2}}>
            <button onClick={()=>navPrev&&onNav(navPrev)} disabled={!navPrev} title="Précédent" style={{fontSize:12,padding:'3px 7px',borderRadius:5,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-secondary)',color:navPrev?'var(--color-text-primary)':'var(--color-text-tertiary)',cursor:navPrev?'pointer':'not-allowed'}}>◀</button>
            <button onClick={()=>navNext&&onNav(navNext)} disabled={!navNext} title="Suivant" style={{fontSize:12,padding:'3px 7px',borderRadius:5,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-secondary)',color:navNext?'var(--color-text-primary)':'var(--color-text-tertiary)',cursor:navNext?'pointer':'not-allowed'}}>▶</button>
          </div>}
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span style={{fontSize:15,fontWeight:500}}>{cleanTitle(bien.title)}</span>
              <Badge statut={bien.statut}/>
              {bien.travaux&&<span style={{fontSize:11,color:'#633806',background:'#FAEEDA',border:'0.5px solid #FAC775',borderRadius:5,padding:'2px 7px'}}>⚠ {bien.travaux}</span>}
              {isTrue(bien.expired)&&<span style={{fontSize:11,color:'#791F1F',background:'#FCEBEB',border:'0.5px solid #F7C1C1',borderRadius:5,padding:'2px 7px'}}>Expiré</span>}
            </div>
            <div style={{fontSize:12,color:'var(--color-text-secondary)',marginTop:3}}>{bien.cp} {bien.ville}{bien.date?' · Publié le '+formatDate(bien.date):''}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
          <select value={bien.statut} onChange={e=>update({statut:e.target.value})} style={{fontSize:11,padding:'4px 8px',borderRadius:6,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-primary)',color:'var(--color-text-primary)'}}>{STATUTS.map(s=><option key={s}>{s}</option>)}</select>
          {!isTrue(bien.expired)&&<button onClick={()=>update({expired:true})} style={{fontSize:11,padding:'4px 8px',borderRadius:6,border:'0.5px solid #F7C1C1',background:'#FCEBEB',color:'#791F1F',cursor:'pointer'}}>Marquer expirée</button>}

            <input value={ni.auteur} onChange={e=>setNi(i=>({...i,auteur:e.target.value}))} placeholder="Qui ? (Médéric, Louis…)" style={{fontSize:11,padding:'4px 6px',borderRadius:5,border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-primary)',color:'var(--color-text-primary)'}}/>
